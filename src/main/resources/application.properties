server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:nexuschat;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Session
server.servlet.session.timeout=24h

# Claude API key - set via environment variable CLAUDE_API_KEY
claude.api.key=${CLAUDE_API_KEY:}

# Logging
logging.level.com.chatapp=INFO
logging.level.org.springframework.web.socket=WARN

# File upload limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB

# WebSocket message size (3MB to accommodate base64 encoded 2MB files)
spring.websocket.message-size-limit=3145728
